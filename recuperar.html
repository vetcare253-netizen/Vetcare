
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Care - Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eef4f9;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .linea-superior {
            height: 8px;
            background-color: #0b3552;
        }

        .contenedor {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .recuperar {
            background-color: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #d8e4ed;
            box-shadow: 0 8px 25px #0b35521a;
        }

        .logo {
            width: 150px;
            max-width: 100%;
            display: block;
            margin: 0 auto 15px;
        }

        h2 {
            color: #0b3552;
            font-weight: bold;
        }

        .linea {
            width: 80px;
            height: 4px;
            background-color: #119e91;
            border-radius: 10px;
            margin: 15px auto 25px;
        }

        .form-label {
            color: #0b3552;
            font-weight: 500;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px;
        }

        .form-control:focus {
            border-color: #119e91;
            box-shadow: 0 0 0 3px #119e9120;
        }

        .btn-primary {
            background-color: #0b3552;
            border-color: #0b3552;
            border-radius: 10px;
            padding: 12px;
        }

        .btn-primary:hover {
            background-color: #119e91;
            border-color: #119e91;
        }

        a {
            color: #0b3552;
            text-decoration: none;
        }

        a:hover {
            color: #119e91;
            text-decoration: underline;
        }

        .banner {
            background-color: #0b3552;
            color: white;
            text-align: center;
            padding: 18px 12px;
            border-top: 5px solid #119e91;
        }

        .banner p {
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="linea-superior"></div>

    <div class="contenedor">
        <div class="recuperar">

            <div class="text-center">
                <img src="logo-vetcare.png" alt="Logo Vet Care" class="logo">
                <h2>Recuperar contraseña</h2>
                <p class="text-muted">
                    Ingresa tu correo y establece una nueva contraseña
                </p>
                <div class="linea"></div>
            </div>

            <form id="formRecuperar">
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" class="form-control"
                           placeholder="Ingresa tu correo" required>
                </div>

                <div class="mb-3">
                    <label for="clave" class="form-label">Nueva contraseña</label>
                    <input type="password" id="clave" class="form-control"
                           placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="mb-3">
                    <label for="confirmar" class="form-label">Confirmar contraseña</label>
                    <input type="password" id="confirmar" class="form-control"
                           placeholder="Repite la nueva contraseña" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Cambiar contraseña
                </button>

                <p id="mensaje" class="text-center mt-3" aria-live="polite"></p>
            </form>

            <div class="text-center mt-3">
                <a href="./login.html">Volver al inicio de sesión</a>
            </div>

        </div>
    </div>

    <footer class="banner">
        <p>VET CARE | BASE DE DATOS DE MASCOTAS Y CITAS</p>
    </footer>

    <script>
        const formulario = document.getElementById("formRecuperar");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            let correo = document.getElementById("correo").value.trim().toLowerCase();
            let clave = document.getElementById("clave").value;
            let confirmar = document.getElementById("confirmar").value;

            if (clave !== confirmar) {
                mensaje.textContent = "Las contraseñas no coinciden";
                mensaje.className = "text-danger text-center mt-3";
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem("usuariosVetCare") || "[]");

            let usuario = usuarios.find(function(usuario) {
                return usuario.correo === correo;
            });

            if (!usuario) {
                mensaje.textContent = "Correo no registrado";
                mensaje.className = "text-danger text-center mt-3";
                return;
            }

            usuario.clave = clave;

            localStorage.setItem("usuariosVetCare", JSON.stringify(usuarios));

            mensaje.textContent = "Contraseña actualizada correctamente";
            mensaje.className = "text-success text-center mt-3";

            formulario.reset();
        });
    </script>

</body>
</html>
