
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Care - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eef4f9;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .linea-superior {
            height: 8px;
            background-color: #0b3552;
        }

        .contenedor {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .login {
            background-color: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #d8e4ed;
            box-shadow: 0 8px 25px #0b35521a;
        }

        .logo {
            width: 150px;
            max-width: 100%;
            display: block;
            margin: 0 auto 15px;
        }

        h2 {
            color: #0b3552;
            font-weight: bold;
        }

        .linea {
            width: 80px;
            height: 4px;
            background-color: #119e91;
            border-radius: 10px;
            margin: 15px auto 25px;
        }

        .form-label {
            color: #0b3552;
            font-weight: 500;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px;
        }

        .form-control:focus {
            border-color: #119e91;
            box-shadow: 0 0 0 3px #119e9120;
        }

        .btn-primary {
            background-color: #0b3552;
            border-color: #0b3552;
            border-radius: 10px;
            padding: 12px;
        }

        .btn-primary:hover {
            background-color: #119e91;
            border-color: #119e91;
        }

        .form-check-input:checked {
            background-color: #119e91;
            border-color: #119e91;
        }

        a {
            color: #0b3552;
            text-decoration: none;
        }

        a:hover {
            color: #119e91;
            text-decoration: underline;
        }

        .banner {
            background-color: #0b3552;
            color: white;
            text-align: center;
            padding: 18px 12px;
            border-top: 5px solid #119e91;
        }

        .banner p {
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="linea-superior"></div>

    <div class="contenedor">
        <div class="login">

            <div class="text-center">
                <img src="logo-vetcare.png" alt="Logo Vet Care" class="logo">
                <h2>Bienvenido a Vet Care</h2>
                <p class="text-muted">Inicia sesión en tu cuenta</p>
                <div class="linea"></div>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" class="form-control"
                           placeholder="Ingresa tu correo" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" id="mostrar" class="form-check-input">
                    <label for="mostrar" class="form-check-label">
                        Mostrar contraseña
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Iniciar sesión
                </button>

                <p id="mensaje" class="text-center mt-3" aria-live="polite"></p>
            </form>

            <div class="text-center mt-3">
                <a href="./recuperar.html">¿Olvidaste tu contraseña?</a>
                <p class="mt-3">
                    ¿No tienes cuenta?
                    <a href="./registrar.html">Regístrate</a>
                </p>
            </div>
        </div>
    </div>

    <footer class="banner">
        <p>VET CARE | BASE DE DATOS DE MASCOTAS Y CITAS</p>
    </footer>

    <script>
        const formulario = document.getElementById("loginForm");
        const password = document.getElementById("password");
        const mostrar = document.getElementById("mostrar");
        const mensaje = document.getElementById("mensaje");

        mostrar.addEventListener("change", function() {
            password.type = mostrar.checked ? "text" : "password";
        });

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            let correo = document.getElementById("correo").value.trim().toLowerCase();
            let clave = password.value;
            let usuarios = JSON.parse(localStorage.getItem("usuariosVetCare") || "[]");

            let usuario = usuarios.find(function(usuario) {
                return usuario.correo === correo && usuario.clave === clave;
            });

            if (usuario) {
                mensaje.textContent = "Bienvenido, " + usuario.nombre;
                mensaje.className = "text-success text-center mt-3";
            } else {
                mensaje.textContent = "Correo o contraseña incorrectos";
                mensaje.className = "text-danger text-center mt-3";
            }
        });
    </script>

</body>
</html>
