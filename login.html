
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VetCare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eaf5f2;
        }

        .container {
            display: flex;
            width: 850px;
            max-width: 95%;
            min-height: 500px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .left {
            width: 50%;
            background: #168b78;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
            text-align: center;
        }

        .left h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .left p {
            line-height: 1.6;
        }

        .animal {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .right {
            width: 50%;
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            color: #168b78;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #168b78;
        }

        .forgot {
            display: block;
            text-align: right;
            color: #168b78;
            text-decoration: none;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #168b78;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #106d5e;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }

        .register a {
            color: #168b78;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
            }

            .left {
                min-height: 200px;
            }

            .animal {
                font-size: 55px;
                margin-bottom: 10px;
            }

            .left h1 {
                font-size: 28px;
            }

            .right {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">
            <div class="animal">🐶 🐱</div>
            <h1>VetCare</h1>
            <p>
                Cuidamos de quienes hacen
                nuestros días más felices.
                Bienvenido a nuestra
                plataforma veterinaria.
            </p>
        </div>

        <div class="right">

            <h2>¡Bienvenido!</h2>
            <p class="subtitle">
                Ingresa a tu cuenta de VetCare
            </p>

            <form id="loginForm">

                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <a href="#" class="forgot">
                    ¿Olvidaste tu contraseña?
                </a>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p class="register">
                ¿No tienes cuenta?
                <a href="#">Regístrate aquí</a>
            </p>

        </div>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Diseño de login listo. Falta conectar la autenticación.");

        });
    </script>

</body>
</html>
